<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Nudges</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span class="title">Attendance Nudges</span>
      </div>
      <button id="btnOptions" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <!-- Status Section -->
    <div id="statusContainer" class="status-box">
      <div class="status-header">
        <span class="status-indicator" id="statusIndicator"></span>
        <span class="status-text" id="statusBadge">Checking...</span>
      </div>
      <div class="employee-name" id="employeeName">--</div>
    </div>

    <!-- Metrics Section -->
    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-label">Hours Today</span>
        <span class="metric-value" id="hoursToday">0.0h</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Last Check-In</span>
        <span class="metric-value" id="lastActionTime">--:--</span>
      </div>
    </div>

    <!-- Error Banner -->
    <div id="errorMessage" class="error-banner hidden"></div>

    <!-- Primary Action Button -->
    <button id="btnToggleAttendance" class="btn primary-btn" disabled>
      <span id="toggleSpinner" class="spinner hidden"></span>
      <span id="toggleText">Check In</span>
    </button>

    <!-- Snooze Bar -->
    <div class="snooze-container">
      <span class="snooze-label">Snooze:</span>
      <div class="snooze-pills">
        <button class="pill-btn snooze-btn" data-mins="10">10m</button>
        <button class="pill-btn snooze-btn" data-mins="30">30m</button>
        <button class="pill-btn snooze-btn" data-mins="60">1h</button>
      </div>
      <div id="snoozeStatus" class="snooze-status hidden"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button id="btnOpenOdoo" class="link-btn">Open Odoo</button>
      <button id="btnRefresh" class="icon-btn" title="Refresh">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
